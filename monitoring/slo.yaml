# Lab 4 — service level objectives.
#
# Most students write a target and stop. The third field is where the thinking is: an SLO
# without a stated response to exhaustion is a wish, not an objective.

# Lab 4 — service level objectives.

service: itcs355-predict

objectives:
  - name: availability
    target: 0.99              # 99.0% target allows ~7.2 hours of downtime/month for maintenance and re-deployments.
    window: 30d
    measurement: "successful responses / total responses, excluding 4xx"
    on_budget_exhausted: |
      Halt deployment pipelines and freeze production releases to staging. Page the on-call MLOps engineer via Alertmanager/Slack. Fall back to the last known-good Vertex AI model deployment while investigating infrastructure issues.

  - name: latency
    target_p95_ms: 200         # Matches p95 threshold in loadtest/k6.js under load
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    on_budget_exhausted: |
      Trigger auto-scaling to increase endpoint container replicas. If latency remains elevated for >15 minutes, revert traffic to the CPU-optimized baseline model and freeze feature pipeline rollouts to investigate CPU/memory bottlenecks.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    on_budget_exhausted: |
      Trigger an automated retraining pipeline on recent reference data. If retraining or validation fails, page the ML engineering team to audit data drift and schema contracts before allowing new deployments.
