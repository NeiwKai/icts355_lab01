# ITCS355 Lab 4 — continuous integration.
#
# The sequence matters: cheap checks first, so a schema mistake fails in 30 seconds
# rather than after a build. Deploy is in cd.yml and runs only on main, only on green.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # required for OIDC. See cd.yml — no long-lived keys anywhere.

jobs:
  # --- 1. CHEAP CHECKS & TEST SUITE ----------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Secret scan
        run: make scan-secrets

      - name: Lint
        # ruff is pinned in requirements.txt and installed above. Installing it unpinned
        # here would let a new ruff release fail this build on unchanged code.
        run: ruff check src/ service/ monitoring/ scripts/ tests/

      - name: Unit & Preprocessing tests
        run: pytest -q tests/test_unit.py

      - name: Data contract tests
        run: pytest -q tests/test_data.py

      - name: Portability audit
        run: python scripts/portability_audit.py

      - name: Generate dataset
        run: python scripts/make_dataset.py

      - name: Data contract tests
        run: pytest -q tests/test_data.py

      - name: Model behaviour tests
        run: pytest -q tests/test_model_behaviour.py

      - name: Service tests
        run: pytest -q tests/test_service.py

  # --- 2. CONTAINER BUILD & INTEGRATION TEST --------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The integration test below runs make_dataset/train/export on the runner to
      # produce the artefact the serving container is then asked to serve, so this job
      # needs the same interpreter and pins as the test job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build training image
        run: docker buildx build --platform linux/amd64 -t itcs355:${{ github.sha }} --load .

      - name: Build serving image
        run: docker buildx build --platform linux/amd64 -f service/Dockerfile.serve -t itcs355-serve:${{ github.sha }} --load .

      - name: Integration test
        run: |
          python scripts/make_dataset.py
          python -m src.train --metrics-out reports/metrics.json
          python scripts/export_model.py --out reports/model.joblib
          docker run -d --rm --name svc -p 8080:8080 \
            -v "$PWD/reports:/app/reports:ro" \
            -e MODEL_PATH=/app/reports/model.joblib \
            -e MODEL_VERSION=${{ github.sha }} \
            itcs355-serve:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf localhost:8080/ready && break || sleep 2
          done
          curl -sf -X POST localhost:8080/predict \
            -H 'content-type: application/json' \
            -d '{"temp_c":78.4,"vibration_mm_s":3.1,"pressure_kpa":315.2,"hours_since_service":4200,"load_pct":68,"ambient_humidity":55}' \
            | tee /dev/stderr | grep -q probability
          docker stop svc

      # Images are tagged with the commit SHA, never `latest`. A `latest` tag makes it
      # impossible to say which code is serving, which is the question you will be asked
      # during an incident.

  # --- 3. CD TO STAGING (GREEN AND MAIN ONLY) --------------------------------
  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OIDC Authentication using Repository Secrets
      - name: Authenticate to GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker CLI
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Push image
        run: |
          python -c "from src import config; from cloudlayer.factory import get_adapter; \
            print(get_adapter(config.load()).push_image('itcs355-serve:${{ github.sha }}'))"

      - name: Deploy to Vertex AI staging endpoint
        run: |
          python -c "\
            from src import config; \
            from cloudlayer.factory import get_adapter; \
            cfg = config.load(); \
            adapter = get_adapter(cfg); \
            ep = adapter.deploy('itcs355-serve:${{ github.sha }}', 'itcs355-endpoint-staging', 'n1-standard-2'); \
            print('Deployed to Endpoint:', ep)"

      - name: Post-deployment smoke test
        run: |
          python -c "\
            from src import config; \
            from cloudlayer.factory import get_adapter; \
            cfg = config.load(strict=False); \
            adapter = get_adapter(cfg); \
            payloads = [ \
              {'temp_c': 82.478, 'vibration_mm_s': 4.888, 'pressure_kpa': 308.557, 'hours_since_service': 1508.063, 'load_pct': 95.792, 'ambient_humidity': 63.407}, \
              {'temp_c': 45.120, 'vibration_mm_s': 1.210, 'pressure_kpa': 101.325, 'hours_since_service': 120.500, 'load_pct': 40.000, 'ambient_humidity': 50.000} \
            ]; \
            [print('Smoke Test Response:', adapter.invoke('itcs355-endpoint-staging', p)) for p in payloads]"
