# ITCS355 Lab 4 — continuous deployment.
#
# Runs only on main, only after CI is green. Credentials come from OIDC federation, not
# from stored keys — todo(Lab 4): uncomment the block for YOUR provider and delete the
# other two.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # --- GCP ---------------------------------------------------------------
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      - name: Push image
        run: |
          python -c "from src import config; from cloudlayer.factory import get_adapter; \
            print(get_adapter(config.load()).push_image('itcs355-serve:${{ github.sha }}'))"

      - name: Deploy to staging
        run: |
          python -c "\
            from src import config; \
            from cloudlayer.factory import get_adapter; \
            cfg = config.load(); \
            adapter = get_adapter(cfg); \
            ep = adapter.deploy('itcs355-serve:${{ github.sha }}', 'itcs355-endpoint-staging', 'n1-standard-2'); \
            print('Deployed to Endpoint:', ep)"


      - name: Smoke test
        run: |
          python -c "\
            from src import config; \
            from cloudlayer.factory import get_adapter; \
            cfg = config.load(strict=False); \
            adapter = get_adapter(cfg); \
            payloads = [ \
              {'temp_c': 82.478, 'vibration_mm_s': 4.888, 'pressure_kpa': 308.557, 'hours_since_service': 1508.063, 'load_pct': 95.792, 'ambient_humidity': 63.407}, \
              {'temp_c': 45.120, 'vibration_mm_s': 1.210, 'pressure_kpa': 101.325, 'hours_since_service': 120.500, 'load_pct': 40.000, 'ambient_humidity': 50.000}, \
              {'temp_c': 95.800, 'vibration_mm_s': 8.500, 'pressure_kpa': 450.000, 'hours_since_service': 3500.000, 'load_pct': 99.100, 'ambient_humidity': 75.200} \
                        ]; \
            preds = adapter.invoke('$${ENDPOINT}', payload); \
            print('Smoke Test Response:', preds)"

