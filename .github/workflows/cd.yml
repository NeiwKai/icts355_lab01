# --- GENERATE CLOUD CONFIG ---------------------------------------------
      - name: Generate cloud.env for deployment
        run: |
          cat << 'EOF' > cloud.env
          CLOUD_PROVIDER=gcp
          PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          REGION=${{ secrets.GCP_REGION }}
          BLOB_URI=gs://${{ secrets.GCP_BLOB_URI }}
          CONTAINER_REGISTRY=${{ secrets.GCP_CONTAINER_REGISTRY }}
          MLFLOW_TRACKING_URI=${{ secrets.GCP_MLFLOW_TRACKING_URI }}
          MODEL_REGISTRY_NAME=itcs355-6688132-model
          IDENTITY_REF=${{ secrets.GCP_DEPLOY_SA }}
          EOF

      # --- PUSH IMAGE --------------------------------------------------------
      - name: Push image
        run: |
          python -c "from src import config; from cloudlayer.factory import get_adapter; \
            print(get_adapter(config.load()).push_image('itcs355-serve:${{ github.event.workflow_run.head_sha }}'))"

      # --- DEPLOY TO STAGING --------------------------------------------------
      - name: Deploy to staging
        run: |
          python -c "\
            from src import config; \
            from cloudlayer.factory import get_adapter; \
            cfg = config.load(); \
            adapter = get_adapter(cfg); \
            ep = adapter.deploy('itcs355-serve:${{ github.event.workflow_run.head_sha }}', 'itcs355-endpoint-staging', 'n1-standard-2'); \
            print('Deployed to Endpoint:', ep)"

      # --- SMOKE TEST --------------------------------------------------------
      - name: Smoke test
        run: |
          python -c "\
            from src import config; \
            from cloudlayer.factory import get_adapter; \
            cfg = config.load(strict=False); \
            adapter = get_adapter(cfg); \
            payloads = [ \
              {'temp_c': 82.478, 'vibration_mm_s': 4.888, 'pressure_kpa': 308.557, 'hours_since_service': 1508.063, 'load_pct': 95.792, 'ambient_humidity': 63.407}, \
              {'temp_c': 45.120, 'vibration_mm_s': 1.210, 'pressure_kpa': 101.325, 'hours_since_service': 120.500, 'load_pct': 40.000, 'ambient_humidity': 50.000} \
            ]; \
            [print('Smoke Test Response:', adapter.invoke('itcs355-endpoint-staging', p)) for p in payloads]"
