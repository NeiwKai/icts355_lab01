# ITCS355 Lab 4 — continuous deployment.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      # --- GCP AUTHENTICATION & DOCKER CONFIG --------------------------------
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Configure Docker CLI for GCP Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # --- GENERATE CLOUD CONFIG ---------------------------------------------
      - name: Generate cloud.env for deployment
        run: |
          cat << 'EOF' > cloud.env
          CLOUD_PROVIDER=gcp
          PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          REGION=${{ secrets.GCP_REGION }}
          BLOB_URI=gs://${{ secrets.GCP_BLOB_URI }}
          CONTAINER_REGISTRY=${{ secrets.GCP_CONTAINER_REGISTRY }}
          MLFLOW_TRACKING_URI=${{ secrets.GCP_MLFLOW_TRACKING_URI }}
          MODEL_REGISTRY_NAME=itcs355-6688132-model
          IDENTITY_REF=${{ secrets.GCP_DEPLOY_SA }}
          EOF

      # --- EXPORT / UPLOAD MODEL ARTIFACT ------------------------------------
      - name: Prepare model artifact for deployment
        run: |
          python scripts/make_dataset.py
          python -m src.train --metrics-out reports/metrics.json
          python scripts/export_model.py --out reports/model.joblib

      # --- BUILD LOCAL DOCKER IMAGE ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f service/Dockerfile.serve \
            -t itcs355-serve:${{ github.event.workflow_run.head_sha }} \
            --load .

      # --- PUSH IMAGE & CAPTURE REMOTE URI -----------------------------------
      - name: Push image
        run: |
          python -c "
          from src import config
          from cloudlayer.factory import get_adapter
          adapter = get_adapter(config.load())
          remote_tag = adapter.push_image('itcs355-serve:${{ github.event.workflow_run.head_sha }}')
          print('Pushed remote image:', remote_tag)
          with open('/tmp/remote_tag.txt', 'w') as f:
              f.write(remote_tag)
          "

      # --- DEPLOY TO STAGING USING REMOTE URI --------------------------------
      - name: Deploy to staging
        run: |
          python -c "
          from src import config
          from cloudlayer.factory import get_adapter
          with open('/tmp/remote_tag.txt') as f:
              remote_tag = f.read().strip()
          cfg = config.load()
          adapter = get_adapter(cfg)
          ep = adapter.deploy(remote_tag, 'itcs355-endpoint-staging', 'n1-standard-2')
          print('Deployed to Endpoint:', ep)
          "

      # --- SMOKE TEST --------------------------------------------------------
      - name: Smoke test
        run: |
          python -c "
          from src import config
          from cloudlayer.factory import get_adapter
          cfg = config.load(strict=False)
          adapter = get_adapter(cfg)
          payloads = [
              {'temp_c': 82.478, 'vibration_mm_s': 4.888, 'pressure_kpa': 308.557, 'hours_since_service': 1508.063, 'load_pct': 95.792, 'ambient_humidity': 63.407},
              {'temp_c': 45.120, 'vibration_mm_s': 1.210, 'pressure_kpa': 101.325, 'hours_since_service': 120.500, 'load_pct': 40.000, 'ambient_humidity': 50.000},
              {'temp_c': 95.800, 'vibration_mm_s': 8.500, 'pressure_kpa': 450.000, 'hours_since_service': 3500.000, 'load_pct': 99.100, 'ambient_humidity': 75.200}
          ]
          for p in payloads:
              print('Smoke Test Response:', adapter.invoke('itcs355-endpoint-staging', p))
          "
